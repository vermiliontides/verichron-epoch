name: Python Tests

# VER-18: no Python CI existed before this. .github/workflows/release-tools.yml
# only builds libimobiledevice binaries on release -- it never runs pytest.
# This workflow gates on the test suite that already exists and already
# catches real incidents (enum/schema drift, ingest-transaction atomicity,
# extractor contract violations) but previously only ran when a developer
# remembered to run it locally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://verichron_ci:verichron_ci@localhost:5432/verichron_ci
      # Separate name on purpose: the postgres test backend TRUNCATEs tables,
      # so it only ever reads this, never DATABASE_URL (libs/testing/testing/pg_real.py).
      TEST_DATABASE_URL: postgresql://verichron_ci:verichron_ci@localhost:5432/verichron_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: verichron_ci
          POSTGRES_USER: verichron_ci
          POSTGRES_PASSWORD: verichron_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verichron_ci -d verichron_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # scripts/test_tool_environments.py reads the iLEAPP submodule's
          # requirements.txt to check tools/ileapp against it.
          submodules: recursive

      # Node, pnpm and uv at the versions pinned in mise.toml (EPOCH-458).
      - name: Install toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.4

      # uv takes the interpreter from .python-version (a uv-managed CPython).
      # Only the workspace is installed; the tools/ environments aren't needed
      # by the tests, but their lockfiles must match their manifests.
      - name: Sync workspace
        run: uv sync --locked --all-extras

      - name: Check tool lockfiles
        run: |
          uv lock --check --project tools/mvt
          uv lock --check --project tools/ileapp

      - name: Apply PostgreSQL migrations
        run: uv run python packages/etl-db-writer/migrate.py --db-url "$DATABASE_URL"

      - name: Verify PostgreSQL migrations are repeatable
        run: uv run python packages/etl-db-writer/migrate.py --db-url "$DATABASE_URL"

      - name: Run pytest
        run: uv run pytest -q

      # EPOCH-403: EXPLAIN output for the evidence-scoped correlation reads on
      # a ~260k-record fixture, kept in the log for review. The pytest above
      # already fails the build if either read stops using an index.
      - name: Explain evidence reads
        run: uv run python scripts/explain_evidence_reads.py
        # testpaths / norecursedirs already scoped correctly in root
        # pyproject.toml ([tool.pytest.ini_options]): packages, scripts,
        # apps; iLEAPP/node_modules/.venv/dist/.git/infra excluded. The
        # transaction-boundary suites (test_db_writer.py,
        # test_extractor_ingest_atomicity.py) run every test twice: once on
        # PgDouble, once on the postgres service above via TEST_DATABASE_URL.

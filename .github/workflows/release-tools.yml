name: Build and Release Forensic Tools

on:
  release:
    types: [created]

jobs:
  build-tools:
    name: Build Tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: universal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Environment (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config checkinstall git autoconf automake libtool-bin libssl-dev usbmuxd

      - name: Set up Environment (macOS)
        if: matrix.platform == 'darwin'
        run: |
          brew install autoconf automake libtool pkg-config openssl

      - name: Build and Package binaries
        shell: bash
        run: |
          INSTALL_PREFIX="./dist-tools/bin"
          BUILD_DIR="./build-scratch"
          mkdir -p "$INSTALL_PREFIX"
          mkdir -p "$BUILD_DIR"

          REPOS=(
            "https://github.com/libimobiledevice/libplist.git"
            "https://github.com/libimobiledevice/libimobiledevice-glue.git"
            "https://github.com/libimobiledevice/libusbmuxd.git"
            "https://github.com/libimobiledevice/libtatsu.git"
            "https://github.com/libimobiledevice/libimobiledevice.git"
          )

          export PKG_CONFIG_PATH="$INSTALL_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          export PATH="$INSTALL_PREFIX/bin:$PATH"

          for repo_url in "${REPOS[@]}"; do
            repo_name=$(basename "$repo_url" .git)
            echo "Building $repo_name..."
            git clone --depth 1 "$repo_url" "$BUILD_DIR/$repo_name"
            cd "$BUILD_DIR/$repo_name"
            ./autogen.sh --prefix="$(pwd)/../../dist-tools"
            make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
            make install
            cd -
          done

          # Archive the built binaries
          tar -czf "idevicebackup2-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C dist-tools bin

      - name: Generate Checksums
        shell: bash
        run: |
          FILENAME="idevicebackup2-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          sha256sum "$FILENAME" > "${FILENAME}.sha256"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            idevicebackup2-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
            idevicebackup2-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
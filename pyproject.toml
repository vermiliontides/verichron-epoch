[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verichron-epoch"
version = "0.1.0"
description = "Privacy-first local desktop forensic client and incident response orchestration engine"
requires-python = ">=3.10"
dependencies = [
    "verichron-contracts",
    "verichron-db",
    "verichron-runtime-env",
    "verichron-etl-run",
    "verichron-testing",
    "verichron-mvt-iocs",
    "verichron-crash",
    "verichron-ileapp-bridge",
    "verichron-analysis",
    "verichron-reporting",
    "pytest>=8.0",
    "jsonschema>=4.0",
    "requests>=2.31",
    "stix2>=3.0",
    "faker>=20.0",
]

[tool.setuptools]
py-modules = []

[tool.uv.workspace]
members = [
    "packages/*",
    "libs/*",
    "apps/extractors/*",
    "apps/analysis",
    "apps/reporting",
]
# db-reader is a pure TypeScript/Node package (@verichron/db-reader) with no
# Python source at all -- it belongs to the pnpm workspace, not this one.
# The packages/* glob above would otherwise sweep it in.
exclude = [
    "packages/db-reader",
]

[tool.uv.sources]
verichron-contracts = { workspace = true }
verichron-db = { workspace = true }
verichron-runtime-env = { workspace = true }
verichron-etl-run = { workspace = true }
verichron-testing = { workspace = true }
verichron-mvt-iocs = { workspace = true }
verichron-crash = { workspace = true }
verichron-ileapp-bridge = { workspace = true }
verichron-analysis = { workspace = true }
verichron-reporting = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "scripts", "apps"]
norecursedirs = ["iLEAPP", "node_modules", ".venv", "dist", ".git", "infra"]
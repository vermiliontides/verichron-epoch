[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verichron-mvt-iocs"
version = "0.1.0"
description = "Extractor: normalizes mvt-ios's own check-backup output (alerts.json, timeline.csv) into forensic_records."
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9",
    "verichron-runtime-env",
    "verichron-etl-run",
    "verichron-etl-db-writer",
    "verichron-contracts",
]

[tool.uv.sources]
verichron-runtime-env = { workspace = true }
verichron-etl-run = { workspace = true }
verichron-etl-db-writer = { workspace = true }
verichron-contracts = { workspace = true }

[tool.setuptools]
packages = ["mvt_iocs"]

[tool.setuptools.package-dir]
mvt_iocs = "."

[tool.pyright]
{ "extraPaths": ["apps/extractors/ileapp_bridge/iLEAPP"] }
 
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
 
[project]
name = "verichron-db"
version = "0.1.0"
description = "Schema-bound, transaction-safe Postgres write helpers (atomic ingest) for ingested_files/forensic_records, alongside the migrations that define them."
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9",
    "verichron-contracts",
]
 
[tool.uv.sources]
verichron-contracts = { workspace = true }
 
# setuptools' flat-layout auto-discovery can't pick a module when more than
# one top-level .py file is present (migrate.py + db_writer.py) -- it
# silently discovers neither and falls back to treating migrations/ as a
# namespace package instead. db_writer is the only module other workspace
# members import; migrate.py is invoked directly as a script (see its own
# sys.path handling) and is not meant to be importable, so it's left out.
[tool.setuptools]
py-modules = ["db_writer"]
 
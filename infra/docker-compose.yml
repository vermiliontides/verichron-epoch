services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: forensics
      POSTGRES_PASSWORD: forensics_dev_only
      POSTGRES_DB: forensics
    ports:
      - "5432:5432"
    volumes:
      - forensics_pgdata:/var/lib/postgresql/data
      - ../packages/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  forensics_pgdata: {}
